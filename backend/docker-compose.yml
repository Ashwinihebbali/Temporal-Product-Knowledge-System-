services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chronodev
      POSTGRES_USER: chronodev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chronodev-local}
    ports:
      - "5432:5432"
    volumes:
      - chronodev-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chronodev -d chronodev"]
      interval: 5s
      timeout: 3s
      retries: 20

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-chronodev-local}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - chronodev-neo4j:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p '${NEO4J_PASSWORD:-chronodev-local}' 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://chronodev:${POSTGRES_PASSWORD:-chronodev-local}@postgres:5432/chronodev
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-chronodev-local}
      NEO4J_DATABASE: neo4j
      DATA_DIR: /app/data
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: llama3.2:3b
      USE_OLLAMA: "true"
    volumes:
      - ../axis2_cleaned/axis2_cleaned:/app/data:ro
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 120s
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_URL: http://127.0.0.1:8001
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  chronodev-postgres:
  chronodev-neo4j:
